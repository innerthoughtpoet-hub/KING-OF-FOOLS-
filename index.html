
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>King of Fools — Draw Your Next Vibe</title>
  <style>
    body {
      background: #101010;
      color: white;
      font-family: Georgia, serif;
      text-align: center;
      padding: 30px 15px;
    }
    .card {
      background: #f5f5f5;
      color: #111;
      border: 4px double #111;
      border-radius: 15px;
      width: min(260px, 80vw);
      min-height: 340px;
      margin: 30px auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    button, a {
      display: inline-block;
      background: white;
      color: black;
      padding: 14px 22px;
      border-radius: 8px;
      margin: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>KING OF FOOLS</h1>
  <p>Draw Your Next Vibe</p>

  <div class="card" id="card">
    <h2>♠ ♥ ♣ ♦</h2>
    <p>Your next vibe awaits.</p>
  </div>

  <button onclick="drawCard()">Shuffle & Draw</button>
  <div id="actions" hidden>
    <a id="listen" target="_blank"
       rel="noopener noreferrer">Listen Now</a>
  </div>

  <p>You pull the card. I set the night.</p>

  <script>
    // Starter cards. We'll expand this to all 52.
    const cards = [
      {
        rank: "K♦",
        name: "A Night to Remember",
        animal: "White Peacock",
        url: ""
      },
      {
        rank: "A♠",
        name: "The Final Boss",
        animal: "Dragon",
        url: ""
      },
      {
        rank: "10♣",
        name: "Party Anthems",
        animal: "Dolphin",
        url: ""
      }
    ];

    function drawCard() {
      const card = cards[
        Math.floor(Math.random() * cards.length)
      ];

      document.getElementById("card").innerHTML =
        `<h1>${card.rank}</h1>
         <h2>${card.name}</h2>
         <p>${card.animal}</p>`;

      const listen = document.getElementById("listen");
      const actions = document.getElementById("actions");

      if (card.url) {
        listen.href = card.url;
        actions.hidden = false;
      } else {
        actions.hidden = true;
      }
    }
  </script>
</body>
</html>
